spring:
  application:
    name: error-spike-detection-lab
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  notification:
    base-url: ${NOTIFICATION_BASE_URL:http://localhost:8089}
    health-path: /mock/health
    connect-timeout: 2s
    read-timeout: 3s
